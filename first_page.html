<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google Fonts Links -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Irish+Grover&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="first_page.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Run With The Beat!</title>
</head>
<body>

    <h1>Run With The Beat!</h1>

    <div class="fancy">
        <p title="About Run With The Beat">Let us make your new running playlist!</p>
        <img src="Images\Logo.jpg" alt="Nature" width="200" height="180">

        <form id="runForm">

            <!-- The select tag wraps your choices -->
            <select id="genres" name="selected_genre">
                <option value="" disabled selected>Choose a music Genre...</option>
                <option value="Hip Hop/Rap">Hip Hop/Rap</option>
                <option value="Pop">Pop</option>
                <option value="Latin Music">Latin Music</option>
                <option value="Rock/Alternative">Rock/Alternative</option>
                <option value="R&B/Soul">R&B/Soul</option>
                <option value="ED/Dance">ED/Dance</option>
                <option value="Country">Country</option>
                <option value="Afrobeats">Afrobeats</option>
                <option value="K-Pop">K-Pop</option>
                <option value="Trap">Trap</option>
                <option value="Indie Pop/Alternative">Indie Pop/Alternative</option>
                <option value="Phonk/Drift Phonk">Phonk/Drift Phonk</option>
                <option value="Folk & Acoustic">Folk & Acoustic</option>
                <option value="Classical">Classical</option>
                <option value="Jazz">Jazz</option>
            </select>
            <hr>

            <label>Enter your height in cm:</label>
            <hr>
            <input type="text" id="height" name="height" placeholder="height">
            <hr>
            <label>Enter your desired run distance(kilometers)</label>
            <hr>
            <label>OR</label>
            <hr>
            <label>Enter your pace (kilometers per hour)</label>
            <hr>
            <input type="text" id="distance" name="distance" placeholder="distance">
            <hr>
            <input type="text" id="pace" name="pace" placeholder="pace">
            <hr>
            <label>Select your desired run time (minutes)</label>
            <hr>
            <select id="time" name="selected_time">
                <option value="" disabled selected>Select a run time...</option>
                <option value="15">15</option>
                <option value="30">30</option>
                <option value="45">45</option>
                <option value="60">60</option>
                <option value="75">75</option>
                <option value="90">90</option>
                <option value="105">105</option>
                <option value="120">120</option>
            </select>
            <hr>
            <button type="submit">Submit</button>

        </form>
    </div>

    <script src="first_page.js"></script>
</body>
</html>
